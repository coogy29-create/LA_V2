      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle -p /tmp/src/LimbusAuto2 assembleDebug

      - name: Prepare APK
        run: cp /tmp/src/LimbusAuto2/app/build/outputs/apk/debug/app-debug.apk /tmp/LimbusAuto2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: LimbusAuto2
          path: /tmp/LimbusAuto2.apk
